
services:
  app:
    image: lgu-treasury-app:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
      HTTPS_CERT_PASSWORD: ${HTTPS_CERT_PASSWORD:-}
      Database__ApplyMigrations: "true"
      INITIAL_ADMIN_EMPLOYEE_ID: ${INITIAL_ADMIN_EMPLOYEE_ID:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      ConnectionStrings__DefaultConnection: ${NATIVE_MYSQL_CONNECTION:?NATIVE_MYSQL_CONNECTION is required}
    volumes:
      - type: bind
        source: ${HTTPS_CERT_DIR:-./.aspnet/https}
        target: /https
        read_only: true
    ports:
      - "8092:8080"
      - "8443:8443"
    restart: unless-stopped
