services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-LGUTreasury}
      MYSQL_USER: ${MYSQL_USER:-lgu_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: lgu-treasury-app:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_HTTPS_PORT: 8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/LGUTreasury.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${HTTPS_CERT_PASSWORD:?HTTPS_CERT_PASSWORD is required}
      Database__ApplyMigrations: "true"
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${MYSQL_DATABASE:-LGUTreasury};User=${MYSQL_USER:-lgu_user};Password=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required};SslMode=Required;"
    volumes:
      - type: bind
        source: ${HTTPS_CERT_DIR:?HTTPS_CERT_DIR is required}
        target: /https
        read_only: true
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
    name: lgu-treasury-dev-mysql-data
